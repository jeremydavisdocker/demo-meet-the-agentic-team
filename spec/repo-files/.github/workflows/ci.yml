name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Same gate the Implementer and Reviewer run locally: compile, *Test, *IT, ArchUnit, PIT threshold.
      - run: ./mvnw -B verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/pit-reports
          if-no-files-found: ignore
